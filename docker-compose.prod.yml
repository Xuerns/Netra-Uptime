services:
  # ─────────────────────────────────────────────
  # Netra Uptime App (Pre-built Single Container)
  # ─────────────────────────────────────────────
  netra-uptime:
    image: ghcr.io/xuerns/netra-uptime:latest
    container_name: netra_uptime_app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_MODE=selfhosted
      - PORT=8080
      - JWT_SECRET=change_me_to_a_random_secret_of_at_least_32_characters
      - ALLOWED_ORIGIN=http://localhost:8080
      - PUBLIC_API_URL=http://localhost:8080/api/v1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=netra
      - DB_PASSWORD=netra_secret_change_me
      - DB_NAME=netra_uptime
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_secret_change_me
      - RECENT_CHECKS_LIMIT=60
      - SELFHOSTED_MAX_MONITORS=0
      - SELFHOSTED_MAX_ORGS=0
      - SELFHOSTED_MAX_MEMBERS=0
      - SELFHOSTED_MAX_PIC=10
      - SELFHOSTED_MIN_INTERVAL=10
      - SELFHOSTED_MAX_TIMEOUT=60
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netra_uptime_net

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: netra_uptime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netra
      POSTGRES_PASSWORD: netra_secret_change_me
      POSTGRES_DB: netra_uptime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netra -d netra_uptime"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netra_uptime_net

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: netra_uptime_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret_change_me
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_change_me", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netra_uptime_net

volumes:
  postgres_data:
  redis_data:

networks:
  netra_uptime_net:
    driver: bridge
