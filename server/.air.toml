# Air — hot-reload config untuk Go
# Dokumentasi: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/netra-uptime"
  bin = "./tmp/main"
  delay = 1000               # ms
  exclude_dir = ["assets", "tmp", "vendor", "migrations"]
  include_ext = ["go", "env"]
  exclude_regex = ["_test\\.go"]
  kill_delay = "0s"
  rerun = false
  rerun_delay = 500

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
