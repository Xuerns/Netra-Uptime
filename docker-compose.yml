services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsewatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsewatch} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch_net

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulsewatch_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch_net

  # ─────────────────────────────────────────────
  # PulseWatch App (Single Container: Go API + Embedded UI)
  # ─────────────────────────────────────────────
  pulsewatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsewatch_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV
      - PORT
      - DB_HOST=postgres
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_SSLMODE
      - REDIS_HOST=redis
      - REDIS_PORT
      - REDIS_PASSWORD
      - RECENT_CHECKS_LIMIT
      - SELFHOSTED_MAX_MONITORS
      - SELFHOSTED_MAX_ORGS
      - SELFHOSTED_MAX_MEMBERS
      - SELFHOSTED_MAX_PIC
      - SELFHOSTED_MIN_INTERVAL
      - SELFHOSTED_MAX_TIMEOUT
      - PUBLIC_API_URL
      - PUBLIC_APP_MODE
      - PUBLIC_GOOGLE_CLIENT_ID
      - PUBLIC_GOOGLE_REDIRECT_URL
      - GOOGLE_CLIENT_SECRET
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsewatch_net

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  pulsewatch_net:
    driver: bridge
