name: netra-uptime

services:
  postgres:
    image: postgres:16-alpine
    container_name: netra_uptime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netra_secret}
      POSTGRES_DB: ${POSTGRES_DB:-netra_uptime}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netra} -d ${POSTGRES_DB:-netra_uptime}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netra_uptime_net

  netra-uptime:
    build:
      context: .
      dockerfile: Dockerfile
    image: netra-uptime:latest
    container_name: netra_uptime_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV
      - PORT
      - HOST=0.0.0.0
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_SSLMODE
      - RECENT_CHECKS_LIMIT
      - SELFHOSTED_MAX_MONITORS
      - SELFHOSTED_MAX_ORGS
      - SELFHOSTED_MAX_MEMBERS
      - SELFHOSTED_MAX_PIC
      - SELFHOSTED_MIN_INTERVAL
      - SELFHOSTED_MAX_TIMEOUT
      - PUBLIC_API_URL
    ports:
      - "${PORT:-27346}:27346"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:27346/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netra_uptime_net

volumes:
  postgres_data:

networks:
  netra_uptime_net:
    driver: bridge
