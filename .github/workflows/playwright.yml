name: E2E Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: netra-uptime:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack and wait until healthy
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: client
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 200

      - name: Tear down stack
        if: ${{ always() }}
        run: docker compose down -v
